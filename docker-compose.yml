services:
  news-app:
    build: .
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "${PORT:-1999}:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/news", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
